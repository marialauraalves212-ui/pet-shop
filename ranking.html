    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a class="navbar-brand" href="index.html">
            Pet Shop
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Início</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="banhoetosa.html">
                        Banho e Tosa
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="estoque.html">
                        Estoque
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="vacinacao.html">
                        Vacinação
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="ranking.html">
                        Ranking

                <li class="nav-item">
                    <a class="nav-link" href="atendimentos.html">
                        Atendimentos
                    </a>
                </li>

            </ul>

        </div>
    </div>
    </nav>

    <main class="container py-5">

        <div class="text-center">

            <h1>Ranking de Serviços</h1>

            <p class="lead">
                Informe a quantidade de atendimentos de cada serviço.
            </p>

            <img src="img/estatistica.png" alt="" class="imagem-pets">

        </div>


        <div class="card p-4 mx-auto mt-4" style="max-width: 600px;">

            <div class="mb-3">

                <label for="banho" class="form-label">
                    Banho:
                </label>

                <input type="number" id="banho" class="form-control" placeholder="Quantidade de atendimentos">

            </div>

            <div class="mb-3">

                <label for="tosa" class="form-label">
                    Tosa:
                </label>

                <input type="number" id="tosa" class="form-control" placeholder="Quantidade de atendimentos">

            </div>

            <div class="mb-3">

                <label for="vacina" class="form-label">
                    Vacinação:
                </label>

                <input type="number" id="vacina" class="form-control" placeholder="Quantidade de atendimentos">

            </div>

            <div class="mb-3">

                <label for="consulta" class="form-label">
                    Consulta:
                </label>

                <input type="number" id="consulta" class="form-control" placeholder="Quantidade de atendimentos">

            </div>

            <button onclick="calcularRanking()" class="btn btn-primary">
                Gerar ranking
            </button>

            <div id="resultadoRanking" class="alert alert-info mt-4">
                O ranking aparecerá aqui.
            </div>

        </div>

    </main>

    <footer>Desenvolvido por Maria Laura e Hyara</footer>

    <script src="script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
